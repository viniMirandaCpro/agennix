services:
  db:
    image: postgres:16-alpine
    container_name: agennix-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agennix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agennix}
      POSTGRES_DB: ${POSTGRES_DB:-agennix}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agennix}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: agennix-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    volumes:
      - ./backend:/app
      - /app/venv
    depends_on:
      db:
        condition: service_healthy
    command: flask run --host=0.0.0.0 --port=5000 --debug

  # Envia os SMS de confirmacao e lembrete. Um processo so: dois mandariam SMS em dobro.
  scheduler:
    build: ./backend
    container_name: agennix-scheduler
    restart: unless-stopped
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
      - /app/venv
    depends_on:
      db:
        condition: service_healthy
    command: flask scheduler

  frontend:
    build: ./frontend
    container_name: agennix-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:${BACKEND_PORT:-5000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    command: npm run dev

volumes:
  pgdata:
